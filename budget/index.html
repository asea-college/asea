<body>
  <div id="app"></div>
  <div id="pwa-install-banner" class="pwa-banner hidden">
    <div class="pwa-banner-inner">
      <span class="pwa-banner-text" id="pwa-banner-text">📱 이 앱을 홈 화면에 추가해 빠르게 실행하세요</span>
      <button class="btn small" id="pwa-install-btn" onclick="triggerPwaInstall()">설치하기</button>
      <button class="btn secondary small" onclick="dismissPwaBanner()">✕</button>
    </div>
  </div>
  <div id="ios-install-modal" class="ios-install-modal hidden" onclick="this.classList.add('hidden')">
    <div class="ios-install-card" onclick="event.stopPropagation()">
      <h3>📱 홈 화면에 추가</h3>
      <ul class="ios-install-steps">
        <li><span class="step-num">1</span><span>Safari 하단 <b>공유 버튼</b> (□↑)을 탭하세요</span></li>
        <li><span class="step-num">2</span><span>스크롤하여 <b>"홈 화면에 추가"</b>를 선택하세요</span></li>
        <li><span class="step-num">3</span><span><b>추가</b>를 탭하면 홈 화면 아이콘이 생성됩니다</span></li>
      </ul>
      <button class="btn secondary full" onclick="document.getElementById('ios-install-modal').classList.add('hidden')">닫기</button>
    </div>
  </div>
  <dialog id="dialog"><div class="modal-head"><h2 id="dialogTitle"></h2><button class="xbtn" onclick="closeDialog()" aria-label="닫기">×</button></div><div class="modal-body" id="dialogBody"></div><div class="modal-foot" id="dialogFoot"></div></dialog>
  <div id="toast" class="toast hidden"></div>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm';
    import * as XLSX from 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm';
    const SUPABASE_URL='https://zbpeyklwpotjyveipzxd.supabase.co';
    const SUPABASE_KEY='sb_publishable_DxtNEPtU2KktlcRQnQx9jA_szCPFzMj';
    const sb=createClient(SUPABASE_URL,SUPABASE_KEY);
    const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const won=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Number(n||0))+'원';
    const roleNames={staff:'교직원',dept_budget:'부서 예산담당',dept_head:'부서장',budget_admin:'예산관리 담당',executive:'임원'};
    const statusNames={draft:'작성 중',submitted:'검토 대기',review_department:'부서장 검토',review_budget:'예산관리 검토',returned:'보완 요청',rejected:'반려',approved:'승인 완료',complete:'집행 완료'};
    const state={user:null,profile:null,departments:[],allocations:[],requests:[],lines:[],reviews:[],actuals:[],profiles:[],view:'home',year:2027,filter:'',publicData:null,plPeriod:'2027-01',plDepartmentId:'all',plRevenues:[],plCosts:[],plRules:[],plFactors:[],plRuns:[],plAllocations:[],viewingDeptId:null,returnView:null,showComparison:false,highlightAccount:null,expandedAllocationId:null};
    let ACCOUNT_CODES={};
    async function loadAccountCodes(){
      const {data}=await sb.from('account_code_categories').select('*').order('sort_order');
      ACCOUNT_CODES={};
      (data||[]).forEach(r=>{ACCOUNT_CODES[r.code]={id:r.id,name:r.name,type:r.type,sort_order:r.sort_order,subs:r.subs||[]};});
    }
    function makeAccountCode(main,subIdx){const c=ACCOUNT_CODES[main];if(!c||!c.subs[subIdx-1])return'';return main+'-'+String(subIdx).padStart(2,'0');}
    function displayCode(a){const pts=(a.account_code||'').split('-');const m=pts[0];const idx=parseInt(pts[1]);const cat=ACCOUNT_CODES[m];if(cat&&idx&&cat.subs[idx-1])return m+'-'+String(idx).padStart(2,'0')+'. '+cat.name+'-'+cat.subs[idx-1];return a.account_code||'';}
    function typeLabel(t){return t==='revenue'?'세입':t==='common'?'공통':t==='expense'?'지출':t;}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3600)}
    window.closeDialog=()=>$('#dialog').close();
    function showDialog(title,body,foot){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialogFoot').innerHTML=foot;$('#dialog').showModal()}
    function button(label,action,cls=''){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`}
    function statusBadge(s){return `<span class="status ${esc(s)}">${esc(statusNames[s]||s||'미지정')}</span>`}
    function fmtDate(v){return v?new Date(v).toLocaleDateString('ko-KR'):'—'}
    function canBudget(){return ['dept_budget','dept_head','budget_admin','executive'].includes(state.profile?.role)}
    function isAdmin(){return ['budget_admin','executive'].includes(state.profile?.role)}
    function ownDept(id){return isAdmin()||id===state.profile?.department_id}

    function authScreen(mode='login',message=''){
      const signup=mode==='signup';
      $('#app').innerHTML=`<main class="login-screen"><section class="login-box"><div class="logo">ASEA COLLEGE · FINANCE</div><h1>예산관리 시스템</h1><p class="muted">부서 예산 편성부터 기안·승인·집행 이력까지 관리합니다.</p><form id="authForm"><div class="field"><label>이메일</label><input name="email" type="email" required autocomplete="username" placeholder="학교 이메일"></div>${signup?'<div class="field"><label>이름</label><input name="full_name" required autocomplete="name" placeholder="성명"></div>':''}<div class="field"><label>비밀번호</label><input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="8자 이상"></div><button class="btn full" type="submit">${signup?'계정 만들기':'로그인'}</button><div class="error" id="authError">${esc(message)}</div></form><div class="actions" style="justify-content:space-between"><button class="btn secondary small" onclick="authScreen('${signup?'login':'signup'}')">${signup?'로그인으로 돌아가기':'처음 이용하나요? 계정 만들기'}</button><button class="btn secondary small" onclick="resetPassword()">비밀번호 재설정</button></div><div class="login-note">가입한 계정은 기본적으로 권한 대기 상태입니다. 최초 예산관리 담당자가 부서와 역할을 지정한 뒤 업무 메뉴가 열립니다.</div></section></main>`;
      $('#authForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),email=fd.get('email'),password=fd.get('password');const err=$('#authError');err.textContent='처리 중입니다…';
        if(signup){const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:fd.get('full_name')}}});if(error){err.textContent=error.message;return}if(!data.session){err.textContent='Check your email, then sign in to continue.';return}const {error:profileError}=await sb.from('budget_profiles').insert({user_id:data.user.id,email,display_name:fd.get('full_name')});if(profileError){err.textContent='Account created. Sign in again to continue setup.';return}await initialize();}
        else{const {error}=await sb.auth.signInWithPassword({email,password});if(error){err.textContent='이메일 또는 비밀번호를 확인해 주세요.';return}await initialize()}
      });
    }
    window.authScreen=authScreen;
    window.resetPassword=async()=>{const email=prompt('비밀번호 재설정 이메일 주소를 입력해 주세요.');if(!email)return;const {error}=await sb.auth.resetPasswordForEmail(email);toast(error?error.message:'설정된 이메일 주소로 비밀번호 재설정 안내를 요청했습니다.')};
    function pendingScreen(){const p=state.profile||{};$('#app').innerHTML=`<main class="login-screen"><section class="login-box"><div class="logo">ASEA COLLEGE · ACCESS</div><h1>권한 설정이 필요합니다</h1><p class="muted">${esc(p.display_name||state.user?.email||'사용자')} 계정이 등록되었습니다. 부서와 역할이 지정되면 예산관리 메뉴를 사용할 수 있습니다.</p><div class="detail-box"><label>현재 상태</label><strong>${p.department_id?esc(roleNames[p.role]||p.role):'부서·역할 대기'}</strong></div>${isAdmin()?'<div class="login-note">관리자 권한이 설정되었습니다. 다시 불러오기를 눌러 시스템으로 이동하세요.</div>':''}<div class="field"><label>최초 관리자 활성화 코드 (최초 1회)</label><input id="bootstrapCode" autocomplete="off" placeholder="관리자가 받은 48자리 코드"></div><div class="actions">${button('관리자 활성화','claimAdmin()','success')}${button('다시 불러오기','initialize()','secondary')}${button('로그아웃','signOut()','secondary')}</div></section></main>`}
    window.claimAdmin=async()=>{const code=$('#bootstrapCode')?.value?.trim();if(!code)return toast('활성화 코드를 입력해 주세요.');const {error}=await sb.rpc('budget_claim_initial_admin',{p_code:code});if(error)return toast(error.message);toast('최초 예산관리 담당자로 등록했습니다.');await initialize()};
    window.signOut=async()=>{await sb.auth.signOut();state.user=null;state.profile=null;authScreen()};
    async function initialize(){const {data:{user},error}=await sb.auth.getUser();if(error||!user){authScreen();return}state.user=user;const {data:profile,error:pe}=await sb.from('budget_profiles').select('user_id,email,display_name,department_id,role,is_active,can_view_all_departments,is_visible,department:budget_departments(id,code,name)').eq('user_id',user.id).maybeSingle();if(pe){authScreen('login','계정 정보를 불러오지 못했습니다. 잠시 후 다시 로그인해 주세요.');return}if(!profile){const {error:created}=await sb.from('budget_profiles').insert({user_id:user.id,email:user.email||'',display_name:user.user_metadata?.full_name||user.email?.split('@')[0]||'Staff'});if(!created){const {data:again}=await sb.from('budget_profiles').select('user_id,email,display_name,department_id,role,is_active,can_view_all_departments,is_visible,department:budget_departments(id,code,name)').eq('user_id',user.id).maybeSingle();profile=again}}state.profile=profile;if(!profile||!profile.is_active||!profile.department_id&&profile.role!=='budget_admin'){pendingScreen();return}if(profile.role==='budget_admin'||profile.role==='executive'||profile.department_id){await loadData();render() }else pendingScreen()}
    async function loadData(){await loadAccountCodes();const y=state.year;const tasks=[sb.from('budget_departments').select('id,code,name,sort_order,active').order('sort_order'),sb.from('budget_allocations').select('*,department:budget_departments(name,code)').eq('fiscal_year',y).order('created_at',{ascending:false}),sb.from('budget_requests').select('*,department:budget_departments(name),allocation:budget_allocations(account_code,account_name)').eq('fiscal_year',y).order('created_at',{ascending:false}),sb.from('budget_actuals').select('request_id,amount,spent_on,is_final'),sb.from('budget_reviews').select('*').order('created_at',{ascending:false})];if(isAdmin())tasks.push(sb.from('budget_profiles').select('user_id,email,display_name,department_id,role,is_active,can_view_all_departments,is_visible,department:budget_departments(name)').order('email'));
      const rs=await Promise.all(tasks);for(const r of rs){if(r.error){console.error(r.error);toast('데이터 조회 오류: '+r.error.message);return}}
      [state.departments,state.allocations,state.requests,state.actuals,state.reviews]=rs.slice(0,5).map(x=>x.data||[]);state.profiles=isAdmin()?(rs[5]?.data||[]):[];state.lines=[];
    }
    window.refresh=async()=>{await loadData();render()};
    function navButton(view,label,icon,short){return `<button class="${state.view===view?'active':''}" onclick="setView('${view}')"><span class="nav-long">${icon} ${label}</span><span class="nav-short">${icon} ${short||label}</span></button>`}
    window.setView=async v=>{state.view=v;render();if(v==='people'&&isAdmin()){const {data,error}=await sb.from('budget_profiles').select('user_id,email,display_name,department_id,role,is_active,can_view_all_departments,is_visible,department:budget_departments(name)').order('email');if(!error){state.profiles=data||[];render()}}if(v==='profit'&&isAdmin()){await loadProfitData();render()}if(v==='codeMgmt'&&isAdmin()){render()}};
    function shell(title,content){const prof=state.profile||{};$('#app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="side-brand"><div class="logo">ASEA COLLEGE</div><b>예산관리</b><span>예산 편성 · 결재 · 집행 기록</span></div><nav class="nav"><div class="nav-caption">업무 메뉴</div>${navButton('home','현황판','▦','현황')}${navButton('budgets','부서 예산','₩','예산')}${navButton('requests','지출 신청·기안','▤','지출')}${navButton('review','검토·승인','✓','검토')}${isAdmin()?`${navButton('profit','부서 손익 분석','▤')}<div class="nav-caption">관리</div>${navButton('people','사용자·부서','⚙')}${navButton('codeMgmt','계정코드 관리','#')}`:''}</nav><div class="side-bottom">회계연도 ${state.year}<br>저장된 변경은 권한에 따라 기록됩니다.</div></aside><section class="main"><header class="topbar"><div class="topbar-title">${title}</div><div style="display:flex;align-items:center;gap:10px">${state.profile?.can_view_all_departments?`<select style="font-size:11px;padding:4px 8px;border:1px solid #d0dae3;border-radius:6px" onchange="switchDeptView(this.value)"><option value="">전체 부서</option>${state.departments.map(d=>`<option value="${d.id}"${state.viewingDeptId===d.id?" selected":""} >${esc(d.name)}</option>`).join("")}</select>`:""}<div class="user-chip"><div class="avatar">${esc((prof.display_name||'직').slice(0,1))}</div><div class="user-detail"><b>${esc(prof.display_name||prof.email)}</b><br>${esc(roleNames[prof.role]||'권한 대기')} · ${esc(prof.department?.name||'총괄')}</div><button class="btn secondary small" onclick="signOut()">로그아웃</button></div></div></header><main class="content">${content}</main></section></div>`}
    function yearPicker(){return `<select onchange="changeYear(this.value)"><option value="2027" ${state.year===2027?'selected':''}>2027년도</option><option value="2026" ${state.year===2026?'selected':''}>2026년도</option></select>`}
    window.changeYear=async y=>{state.year=Number(y);await loadData();render()};
    function actualFor(reqId){return state.actuals.filter(a=>a.request_id===reqId).reduce((s,a)=>s+Number(a.amount),0)}
    function allocationFor(id){return state.allocations.find(a=>a.id===id)}
    function homeView(){const list=state.allocations,reqs=state.requests;const total=list.filter(a=>a.status==='approved').reduce((s,a)=>s+Number(a.approved_amount??a.allocated_amount),0);const actual=state.actuals.reduce((s,a)=>s+Number(a.amount),0);const pending=reqs.filter(r=>['review_department','review_budget'].includes(r.status)).length;const remain=Math.max(total-actual,0);const recent=reqs.slice(0,6);
      return `<div class="page-head"><div><h1>예산 현황</h1><p>${state.year}년도 부서별 편성·신청·집행 실적을 확인합니다.</p></div><div class="actions">${printExportBtn()} ${yearPicker()}${isAdmin()?button('엑셀 붙여넣기','newAllocationImport()','secondary'):''}${canBudget()?button('예산 항목 등록','newAllocation()'):''}${button('지출 신청 작성','newRequest()','success')}</div></div><div class="cards"><div class="stat"><label>승인 편성액</label><strong>${won(total)}</strong><small>승인된 부서 예산 합계</small></div><div class="stat"><label>실제 집행액</label><strong>${won(actual)}</strong><small>완료·부분 집행 기록 합계</small></div><div class="stat"><label>남은 예산</label><strong>${won(remain)}</strong><small>승인 편성액 − 실제 집행액</small></div><div class="stat"><label>검토 대기</label><strong>${pending}건</strong><small>부서장 또는 예산관리 검토 필요</small></div></div><div class="two-col"><section class="panel"><div class="panel-head"><h2>최근 지출 신청</h2>${button('전체 보기',"setView('requests')",'secondary small')}</div>${recent.length?`<div class="table-wrap"><table class="table"><thead><tr><th>신청 건</th><th>부서</th><th>예산 항목</th><th>신청액</th><th>상태</th></tr></thead><tbody>${recent.map(r=>`<tr class="clickable" onclick="openRequest('${r.id}')"><td><b>${esc(r.title)}</b><br><small>${esc(r.request_no)}</small></td><td>${esc(r.department?.name)}</td><td>${esc(r.allocation?.account_name||'—')}</td><td class="money">${won(r.requested_amount)}</td><td>${statusBadge(r.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>등록된 신청이 없습니다</b>지출 신청을 만들면 이곳에서 진행 상태를 확인할 수 있습니다.</div>'}</section><section class="panel"><div class="panel-head"><h2>부서별 편성·집행</h2><button onclick="toggleComparison()" class="btn secondary small" style="font-size:11px">${state.showComparison?'2027년만 보기':'2026년 비교'}</button></div><div class="panel-body">${(()=>{const catGroups={};const deptOrder=Object.fromEntries(state.departments.map(d=>[d.id,d.sort_order??999]));list.filter(a=>Number(a.approved_amount??a.allocated_amount)>0||(state.showComparison&&Number(a.actual_2026||0)>0)).forEach(a=>{const k=a.account_name||'기타';if(!catGroups[k]){catGroups[k]={total:0,total26:0,items:[]};}catGroups[k].total+=Number(a.approved_amount??a.allocated_amount);catGroups[k].total26+=Number(a.actual_2026||0);catGroups[k].items.push(a);});if(!Object.keys(catGroups).length)return '<div class="empty">승인된 예산 항목이 없습니다.</div>';return Object.entries(catGroups).sort((x,y)=>x[0].localeCompare(y[0])).map(([catName,grp])=>{const eid='acc_'+catName.replace(/[^0-9a-z\uAC00-\uD7A3]/gi,'_');const sorted=grp.items.slice().sort((a,b)=>(deptOrder[a.department_id]??999)-(deptOrder[b.department_id]??999));const sub=sorted.map(a=>{const spent=reqs.filter(r=>r.allocation_id===a.id).reduce((s,r)=>s+actualFor(r.id),0);const approved=Number(a.approved_amount??a.allocated_amount);const pct=Math.min(100,approved?spent/approved*100:0);return '<div onclick="deptDrillDown(\''+a.department_id+'\',\''+encodeURIComponent(a.account_name||'')+'\')" style="cursor:pointer;padding:5px 10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px">'+'<span style="color:#1a6fc4">'+esc(a.department?.name||'')+(a.category?' · '+esc(a.category):'')+'</span>'+'<span>'+won(spent)+' / '+won(approved)+(state.showComparison&&Number(a.actual_2026||0)>0?' <span style="color:#888;font-size:10px">26년: '+won(Number(a.actual_2026))+'</span>':'')+'</span></div>'+'<div style="margin:2px 10px 4px" class="bar"><i style="width:'+pct+'%"></i></div>';}).join('');return '<div style="margin-bottom:6px">'+'<div onclick="toggleAccordion(\''+eid+'\')" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f4f7fb;border-radius:6px;font-size:12px">'+'<b>'+esc(catName)+'</b><span style="color:#6b8299">'+won(grp.total)+(state.showComparison?' / 26년: '+won(grp.total26):'')+'  ▾</span></div>'+'<div id="'+eid+'" style="display:none;border:1px solid #e8edf2;border-radius:0 0 6px 6px;padding:4px 0">'+sub+'</div></div>';}).join('');})()}</div></section></div>`}
    function allocDetailRow(a){
      const reqs=state.requests.filter(r=>r.allocation_id===a.id);
      const histHtml=reqs.length?'<div class="alloc-hist-table"><table class="table" style="font-size:12px"><thead><tr><th>신청번호·제목</th><th>신청액</th><th>집행액</th><th>상태</th><th></th></tr></thead><tbody>'+reqs.map(r=>{const spent=state.actuals.filter(x=>x.request_id===r.id).reduce((s,x)=>s+Number(x.amount),0);return `<tr><td><b>${esc(r.title)}</b><br><small style="color:#888">${esc(r.request_no)}</small></td><td class="money">${won(r.requested_amount)}</td><td class="money">${spent?won(spent):'—'}</td><td>${statusBadge(r.status)}</td><td>${button('열기',`openRequest('${r.id}')`, 'small secondary')}</td></tr>`;}).join('')+'</tbody></table></div>':'<div class="alloc-hist-empty">아직 집행 이력이 없습니다</div>';
      const approved=Number(a.approved_amount??a.allocated_amount);
      const totalSpent=reqs.reduce((s,r)=>s+state.actuals.filter(x=>x.request_id===r.id).reduce((ss,x)=>ss+Number(x.amount),0),0);
      const remain=approved-totalSpent;
      return `<tr id="ad_${a.id}" class="alloc-detail-row"><td colspan="99"><div class="alloc-detail-panel"><div class="alloc-detail-top"><div class="alloc-detail-meta"><span>편성액 <b>${won(approved)}</b></span><span>집행액 <b class="${totalSpent>approved?'over-budget':''}">${won(totalSpent)}</b></span><span>잔여 <b>${won(Math.max(0,remain))}</b></span></div></div><div class="alloc-detail-hist"><div class="alloc-hist-label">집행 이력 (${reqs.length}건)</div>${histHtml}</div></div></td></tr>`;
    }

    window.readBudgetExcel=async input=>{const file=input.files?.[0];if(!file)return;try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});const sheet=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:false,defval:''});const norm=v=>String(v||'').replace(/\s/g,'').toLowerCase();const patterns={code:/계정.?코드|예산.?코드|목.?코드|세목.?코드|관.?항.?목/,name:/항목명|계정과목|세목명|목명|예산항목|사업명|내역명/,category:/분류|구분|비목/,amount:/예산액|편성액|요구액|산출금액|금액/,basis:/산출근거|산출내역|편성근거|비고|산출기초/};let hi=-1,idx={};for(let r=0;r<Math.min(rows.length,80);r++){const h=rows[r].map(norm),found={};for(const [k,re] of Object.entries(patterns))found[k]=h.findIndex(x=>re.test(x));const score=Object.values(found).filter(x=>x>=0).length;if(score>Object.values(idx).filter(x=>x>=0).length){hi=r;idx=found}if(found.name>=0&&found.amount>=0&&found.code>=0)break}if(hi<0||idx.name<0||idx.amount<0){toast('열 이름을 자동으로 찾지 못했습니다. 열 이름이 표시된 표를 엑셀에서 복사해 아래 입력란에 붙여넣어 주세요.');return}const out=[];for(const row of rows.slice(hi+1)){const code=idx.code>=0?String(row[idx.code]||'').trim():'';const name=String(row[idx.name]||'').trim();const amountText=String(row[idx.amount]||'').trim();const amount=Number(amountText.replace(/[^0-9.-]/g,''));if(!name||!amountText||!Number.isSafeInteger(amount)||amount<0||/합계|총계|소계/.test(name))continue;const category=idx.category>=0?String(row[idx.category]||'').trim():'';const basis=idx.basis>=0?String(row[idx.basis]||'').trim():'';if(!code&&!name)continue;out.push([code||('AUTO-'+String(out.length+1).padStart(3,'0')),name,category,amount,basis].join('\t'))}if(!out.length){toast('예산 항목 행을 인식하지 못했습니다. 표의 열 이름과 자료 형태를 확인해 주세요.');return}const ta=$('#bulkAllocForm textarea[name=rows]');ta.value=out.join('\n');const fn=file.name;let code='';if(/학사운영/.test(fn))code='1-2-ACA';else if(/직업훈련/.test(fn))code='1-2-VOC';else{const m=fn.match(/(?:^|[^0-9])(0|1-[134]|2-[12456]|3-[124])(?:[^0-9]|$)/);if(m)code=m[1]}const dept=state.departments.find(d=>d.code===code);if(dept)$('#bulkAllocForm select[name=department_id]').value=dept.id;toast(file.name+'에서 '+out.length+'개 예산 항목을 읽었습니다. 반영 전에 부서와 금액을 확인해 주세요.')}catch(e){toast('엑셀 읽기 오류: '+(e?.message||e))}};

    window.applyAiSugg=()=>{const data=state._aiSugg;if(!data||!data.allocation_id)return toast('추천 결과가 없습니다. AI 추천을 다시 시도해 주세요.');const sel=$('#allocSelect');if(sel){sel.value=data.allocation_id;checkBudgetWarn()}const titleEl=document.querySelector('[name="title"]');if(titleEl&&!titleEl.value){const inp=$('#aiInput');if(inp)titleEl.value=inp.value.trim()}const purposeEl=document.querySelector('[name="purpose"]');if(purposeEl&&!purposeEl.value){const inp=$('#aiInput');if(inp)purposeEl.value=inp.value.trim()}if(data.suggested_amount){const lines=document.querySelectorAll('.cost-line');if(lines.length===1){const p=lines[0].querySelector('.cost-price');if(p&&!p.value){p.value=data.suggested_amount;updateTotal()}}}toast('AI 추천 항목을 적용했습니다. 내용을 확인하고 필요하면 수정해 주세요.');};

<h1>ASEA College 예산관리 · ${title}</h1>
<div class="meta">출력일시: ${new Date().toLocaleString('ko-KR')} &nbsp;|&nbsp; 회계연도 ${state.year}</div>
${bodyHtml}
<script>window.onload=()=>{setTimeout(()=>{window.print();window.onafterprint=()=>window.close();},300)}<\/script>
</body></html>`);
      w.document.close();
    }

    function _esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function _won(n){return Number(n||0).toLocaleString('ko-KR')+'원';}

    function printCurrentView(){
      const v=state.view;
      const titles2={home:'종합 현황',budgets:'부서 예산',requests:'지출 신청',review:'검토·승인',people:'사용자·부서',profit:'부서 손익',codeMgmt:'계정코드 관리'};
      const title=titles2[v]||v;
      let html='';
      if(v==='home') html=_printHome();
      else if(v==='budgets') html=_printBudgets();
      else if(v==='requests') html=_printRequests();
      else if(v==='review') html=_printReview();
      else if(v==='people') html=_printPeople();
      else if(v==='profit') html=_printProfit();
      else if(v==='codeMgmt') html=_printCodeMgmt();
      else html='<p>이 메뉴는 출력 미리보기를 지원하지 않습니다.</p>';
      _printOpen(title, html);
    }

    function _printHome(){
      const depts=[...new Set(state.allocations.map(a=>a.department?.name).filter(Boolean))].sort();
      return depts.map((dn,i)=>{
        const rows=state.allocations.filter(a=>a.department?.name===dn);
        const totAmt=rows.reduce((s,a)=>s+Number(a.allocated_amount),0);
        const totAppr=rows.reduce((s,a)=>s+Number(a.approved_amount??a.allocated_amount),0);
        return `<div class="${i?'dept-break':''}"><h2>${_esc(dn)}</h2>
<table><thead><tr><th>예산 항목</th><th>분류</th><th>산출 근거</th><th>편성액</th><th>확정액</th><th>상태</th></tr></thead><tbody>
${rows.map(a=>`<tr><td><b>${_esc(a.account_name)}</b></td><td>${_esc(a.category)}</td><td>${_esc(a.basis||'—')}</td><td class="money">${_won(a.allocated_amount)}</td><td class="money">${a.approved_amount!=null?_won(a.approved_amount):'—'}</td><td>${a.status}</td></tr>`).join('')}
<tr style="font-weight:bold;background:#dbe7f4"><td colspan="3">합 계</td><td class="money">${_won(totAmt)}</td><td class="money">${_won(totAppr)}</td><td></td></tr>
</tbody></table></div>`;
      }).join('');
    }

    function _printBudgets(){
      const q=state.filter.toLowerCase();
      const deptF=state.viewingDeptId;
      const rows=state.allocations.filter(a=>(deptF?a.department_id===deptF:true)&&`${a.account_name} ${a.account_code} ${a.department?.name}`.toLowerCase().includes(q));
      return `<table><thead><tr><th>부서</th><th>코드</th><th>예산 항목</th><th>분류</th><th>산출 근거</th><th>편성액</th><th>확정액</th>${state.showComparison?'<th>2026 집행</th>':''}<th>상태</th></tr></thead><tbody>
${rows.map(a=>`<tr><td>${_esc(a.department?.name)}</td><td>${_esc(a.account_code||'')}</td><td><b>${_esc(a.account_name)}</b></td><td>${_esc(a.category)}</td><td>${_esc(a.basis||'—')}</td><td class="money">${_won(a.allocated_amount)}</td><td class="money">${a.approved_amount!=null?_won(a.approved_amount):'—'}</td>${state.showComparison?`<td class="money">${a.actual_2026!=null&&Number(a.actual_2026)>0?_won(a.actual_2026):'—'}</td>`:''}<td>${a.status}</td></tr>`).join('')}
</tbody></table>`;
    }

    function _printRequests(){
      const q=state.filter.toLowerCase();
      const rows=state.requests.filter(r=>`${r.title} ${r.request_no} ${r.department?.name}`.toLowerCase().includes(q));
      return `<table><thead><tr><th>신청번호</th><th>제목</th><th>부서</th><th>예산 항목</th><th>신청액</th><th>승인액</th><th>그룹웨어</th><th>상태</th></tr></thead><tbody>
${rows.map(r=>`<tr><td>${_esc(r.request_no)}</td><td>${_esc(r.title)}</td><td>${_esc(r.department?.name)}</td><td>${_esc(r.allocation?.account_name||'—')}</td><td class="money">${_won(r.requested_amount)}</td><td class="money">${r.approved_amount!=null?_won(r.approved_amount):'—'}</td><td>${_esc(r.groupware_document_no||'—')}</td><td>${r.status}</td></tr>`).join('')}
</tbody></table>`;
    }

    function _printReview(){
      const rows=state.requests.filter(r=>['review_department','review_budget'].includes(r.status));
      const allocs=state.allocations.filter(a=>a.status==='submitted');
      return `<h2>검토 대기 지출 신청 (${rows.length}건)</h2>
<table><thead><tr><th>신청번호</th><th>제목</th><th>부서</th><th>신청액</th><th>상태</th></tr></thead><tbody>
${rows.map(r=>`<tr><td>${_esc(r.request_no)}</td><td>${_esc(r.title)}</td><td>${_esc(r.department?.name)}</td><td class="money">${_won(r.requested_amount)}</td><td>${r.status}</td></tr>`).join('')||'<tr><td colspan="5">대기 중인 신청 없음</td></tr>'}
</tbody></table>
<h2>검토 대기 예산 편성 (${allocs.length}건)</h2>
<table><thead><tr><th>부서</th><th>예산 항목</th><th>편성액</th><th>상태</th></tr></thead><tbody>
${allocs.map(a=>`<tr><td>${_esc(a.department?.name)}</td><td>${_esc(a.account_name)}</td><td class="money">${_won(a.allocated_amount)}</td><td>${a.status}</td></tr>`).join('')||'<tr><td colspan="4">대기 중인 편성 없음</td></tr>'}
</tbody></table>`;
    }

    function _printPeople(){
      return `<h2>사용자 목록</h2>
<table><thead><tr><th>이름</th><th>이메일</th><th>부서</th><th>역할</th><th>상태</th></tr></thead><tbody>
${state.profiles.map(p=>`<tr><td>${_esc(p.display_name||'미등록')}</td><td>${_esc(p.email)}</td><td>${_esc(p.department?.name||'미지정')}</td><td>${_esc(p.role)}</td><td>${p.is_active?'활성':'중지'}</td></tr>`).join('')}
</tbody></table>
<h2>부서 목록</h2>
<table><thead><tr><th>코드</th><th>부서명</th><th>상태</th></tr></thead><tbody>
${state.departments.map(d=>`<tr><td>${_esc(d.code)}</td><td>${_esc(d.name)}</td><td>${d.active?'사용':'중지'}</td></tr>`).join('')}
</tbody></table>`;
    }

    function _printProfit(){
      const active=state.departments.filter(d=>d.active&&d.code!=='0');
      const depts=state.plDepartmentId==='all'?active:active.filter(d=>d.id===state.plDepartmentId);
      const direct=state.plCosts.filter(c=>c.scope==='direct');
      const rows=depts.map(d=>{
        const rev=state.plRevenues.filter(x=>x.department_id===d.id).reduce((s,x)=>s+Number(x.amount),0);
        const dir=direct.filter(x=>x.department_id===d.id).reduce((s,x)=>s+Number(x.amount),0);
        const ind=state.plAllocations.filter(x=>x.department_id===d.id).reduce((s,x)=>s+Number(x.allocated_amount),0);
        const profit=rev-dir-ind;
        return{d,rev,dir,ind,profit,margin:rev?profit/rev*100:0};
      });
      return `<table><thead><tr><th>부서</th><th>수입</th><th>직접비</th><th>간접비 배부</th><th>손익</th><th>손익률</th></tr></thead><tbody>
${rows.map(x=>`<tr><td>${_esc(x.d.code)} · ${_esc(x.d.name)}</td><td class="money">${_won(x.rev)}</td><td class="money">${_won(x.dir)}</td><td class="money">${_won(x.ind)}</td><td class="money">${_won(x.profit)}</td><td>${x.margin.toFixed(1)}%</td></tr>`).join('')}
</tbody></table>`;
    }

    function _printCodeMgmt(){
      const cats=Object.entries(ACCOUNT_CODES||{}).sort((a,b)=>(a[1].sort_order||0)-(b[1].sort_order||0));
      return ['expense','revenue','common'].map(type=>{
        const list=cats.filter(([,v])=>v.type===type);
        const labels={expense:'지출 예산 코드',revenue:'세입 예산 코드',common:'공통 법인 코드'};
        return `<h2>${labels[type]}</h2>
<table><thead><tr><th style="width:80px">코드</th><th>카테고리명</th><th>세부 항목</th></tr></thead><tbody>
${list.map(([code,c])=>`<tr><td>${_esc(code)}</td><td><b>${_esc(c.name)}</b></td><td>${(c.subs||[]).map(s=>_esc(s)).join(', ')}</td></tr>`).join('')||'<tr><td colspan="3">항목 없음</td></tr>'}
</tbody></table>`;
      }).join('');
    }

    // ── Excel Export ──────────────────────────────────────────────────────────
    function exportCurrentView(){
      const v=state.view;
      let wb,filename;
      const labels={home:'종합현황',budgets:'부서예산',requests:'지출신청',review:'검토승인',people:'사용자부서',profit:'부서손익',codeMgmt:'계정코드'};
      filename=`ASEA_${labels[v]||v}_${state.year}_${new Date().toISOString().slice(0,10)}.xlsx`;
      try{
        wb=XLSX.utils.book_new();
        if(v==='home') _exportHome(wb);
        else if(v==='budgets') _exportBudgets(wb);
        else if(v==='requests') _exportRequests(wb);
        else if(v==='review') _exportReview(wb);
        else if(v==='people') _exportPeople(wb);
        else if(v==='profit') _exportProfit(wb);
        else if(v==='codeMgmt') _exportCodeMgmt(wb);
        else{XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['지원하지 않는 메뉴입니다.']]),'Sheet1');}
        XLSX.writeFile(wb,filename);
      }catch(e){alert('엑셀 저장 중 오류가 발생했습니다: '+e.message);}
    }

    function _exportHome(wb){
      const depts=[...new Set(state.allocations.map(a=>a.department?.name).filter(Boolean))].sort();
      depts.forEach(dn=>{
        const rows=state.allocations.filter(a=>a.department?.name===dn);
        const aoa=[['예산 항목','분류','산출 근거','편성액','확정액','상태'],...rows.map(a=>[a.account_name,a.category,a.basis||'',Number(a.allocated_amount),a.approved_amount!=null?Number(a.approved_amount):'',a.status])];
        const ws=XLSX.utils.aoa_to_sheet(aoa);
        XLSX.utils.book_append_sheet(wb,ws,dn.slice(0,31));
      });
    }

    function _exportBudgets(wb){
      const q=state.filter.toLowerCase();
      const deptF=state.viewingDeptId;
      const rows=state.allocations.filter(a=>(deptF?a.department_id===deptF:true)&&`${a.account_name} ${a.account_code} ${a.department?.name}`.toLowerCase().includes(q));
      const header=['부서','예산코드','예산 항목','분류','산출 근거','편성액','확정액','상태'];
      if(state.showComparison) header.splice(7,0,'2026 집행액');
      const aoa=[header,...rows.map(a=>{const row=[a.department?.name,a.account_code||'',a.account_name,a.category,a.basis||'',Number(a.allocated_amount),a.approved_amount!=null?Number(a.approved_amount):'',a.status];if(state.showComparison)row.splice(7,0,a.actual_2026!=null?Number(a.actual_2026):'');return row;})];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb,ws,'부서예산');
    }

    function _exportRequests(wb){
      const q=state.filter.toLowerCase();
      const rows=state.requests.filter(r=>`${r.title} ${r.request_no} ${r.department?.name}`.toLowerCase().includes(q));
      const aoa=[['신청번호','제목','부서','예산 항목','신청액','승인액','그룹웨어 문서번호','상태'],...rows.map(r=>[r.request_no,r.title,r.department?.name,r.allocation?.account_name||'',Number(r.requested_amount),r.approved_amount!=null?Number(r.approved_amount):'',r.groupware_document_no||'',r.status])];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb,ws,'지출신청');
    }

    function _exportReview(wb){
      const rows=state.requests.filter(r=>['review_department','review_budget'].includes(r.status));
      const aoa=[['신청번호','제목','부서','신청액','상태'],...rows.map(r=>[r.request_no,r.title,r.department?.name,Number(r.requested_amount),r.status])];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb,ws,'검토대기신청');
      const allocs=state.allocations.filter(a=>a.status==='submitted');
      const aoa2=[['부서','예산 항목','편성액','상태'],...allocs.map(a=>[a.department?.name,a.account_name,Number(a.allocated_amount),a.status])];
      const ws2=XLSX.utils.aoa_to_sheet(aoa2);
      XLSX.utils.book_append_sheet(wb,ws2,'검토대기편성');
    }

    function _exportPeople(wb){
      const aoa=[['이름','이메일','부서','역할','상태'],...state.profiles.map(p=>[p.display_name||'',p.email,p.department?.name||'',p.role,p.is_active?'활성':'중지'])];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb,ws,'사용자');
      const aoa2=[['코드','부서명','상태'],...state.departments.map(d=>[d.code,d.name,d.active?'사용':'중지'])];
      const ws2=XLSX.utils.aoa_to_sheet(aoa2);
      XLSX.utils.book_append_sheet(wb,ws2,'부서');
    }

    function _exportProfit(wb){
      const active=state.departments.filter(d=>d.active&&d.code!=='0');
      const depts=state.plDepartmentId==='all'?active:active.filter(d=>d.id===state.plDepartmentId);
      const direct=state.plCosts.filter(c=>c.scope==='direct');
      const aoa=[['부서코드','부서명','수입','직접비','간접비 배부','손익','손익률'],...depts.map(d=>{const rev=state.plRevenues.filter(x=>x.department_id===d.id).reduce((s,x)=>s+Number(x.amount),0);const dir=direct.filter(x=>x.department_id===d.id).reduce((s,x)=>s+Number(x.amount),0);const ind=state.plAllocations.filter(x=>x.department_id===d.id).reduce((s,x)=>s+Number(x.allocated_amount),0);const profit=rev-dir-ind;return[d.code,d.name,rev,dir,ind,profit,rev?(profit/rev*100).toFixed(1)+'%':'0.0%'];})];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb,ws,'부서손익');
    }

    function _exportCodeMgmt(wb){
      const cats=Object.entries(ACCOUNT_CODES||{}).sort((a,b)=>(a[1].sort_order||0)-(b[1].sort_order||0));
      const aoa=[['코드','카테고리명','유형','세부 항목'],...cats.map(([code,c])=>[code,c.name,c.type,(c.subs||[]).join(', ')])];
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(wb,ws,'계정코드');
    }

    // ── PWA install prompt ────────────────────────────────────────────────────
    (function(){
      let _deferredPrompt=null;
      const banner=document.getElementById('pwa-install-banner');
      const iosModal=document.getElementById('ios-install-modal');

      function showBanner(){if(banner)banner.classList.remove('hidden');}

      window.addEventListener('beforeinstallprompt',e=>{
        e.preventDefault();
        _deferredPrompt=e;
        const isSamsung=/SamsungBrowser/i.test(navigator.userAgent);
        const isAndroid=/android/i.test(navigator.userAgent);
        const txt=document.getElementById('pwa-banner-text');
        if(txt){txt.textContent=isSamsung?'📱 갤럭시 홈 화면에 앱을 추가하면 더 빠르게 실행할 수 있습니다':isAndroid?'📱 홈 화면에 추가해 앱처럼 사용하세요':'💻 바탕화면에 앱으로 설치하면 더 빠르게 실행됩니다';}
        showBanner();
      });

      window.addEventListener('appinstalled',()=>{
        if(banner)banner.classList.add('hidden');
        _deferredPrompt=null;
      });

      window.triggerPwaInstall=async()=>{
        if(_deferredPrompt){
          _deferredPrompt.prompt();
          await _deferredPrompt.userChoice;
          _deferredPrompt=null;
          if(banner)banner.classList.add('hidden');
        }else if(iosModal){
          iosModal.classList.remove('hidden');
        }
      };

      window.dismissPwaBanner=()=>{
        if(banner)banner.classList.add('hidden');
        try{sessionStorage.setItem('pwa_dismissed','1');}catch(e){}
      };

      // iOS Safari detection
      const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
      const isSafariOnly=/^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const isStandalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
      if(isIOS&&isSafariOnly&&!isStandalone){
        try{if(!sessionStorage.getItem('pwa_dismissed')){
          const txt=document.getElementById('pwa-banner-text');
          if(txt)txt.textContent='📱 iOS Safari에서 홈 화면에 추가하면 앱처럼 사용할 수 있습니다';
          const btn=document.getElementById('pwa-install-btn');
          if(btn)btn.textContent='방법 보기';
          showBanner();
        }}catch(e){}
      }

      // Register service worker
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>{
          navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
        });
      }
    })();

  </script>
