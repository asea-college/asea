name: ASEA Flutter mobile verification
on:
  push:
    branches: ['feat/**', main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          cd apps/mobile
          flutter create --platforms=android --project-name asea_staff .
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml
          python3 configure_brand.py
          python3 fetch_pretendard.py
          flutter pub get
          flutter analyze --no-fatal-infos
      # Reuse the SAME debug certificate for subsequent beta2 builds while cache is retained.
      # This is test-only and NOT a production signing solution.
      - name: Restore beta2 debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: asea-ieum-beta2-debug-signing-v1
      - name: Ensure beta2 debug signing identity
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
      - name: Build Android arm64 debug test APK
        run: |
          cd apps/mobile
          for attempt in 1 2 3; do
            if flutter build apk --debug --target-platform android-arm64; then
              exit 0
            fi
            echo "Gradle/Maven build attempt ${attempt} failed; retrying transient dependency resolution"
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ASEA-IEUM-Android-arm64-DEBUG-TEST-ONLY
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
# macOS runner and App Store signing may incur costs; run only after budget/Apple account review.
