name: ASEA Flutter mobile verification
on:
  push:
    branches: ['feat/**', main]
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/mobile-build.yml']
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: |
          cd apps/mobile
          flutter create --platforms=android --project-name asea_staff .
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml
          python3 configure_brand.py
          python3 fetch_pretendard.py
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Build Android arm64 debug test APK
        run: |
          cd apps/mobile
          flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ASEA-IEUM-Android-arm64-DEBUG-TEST-ONLY
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
# macOS runner and App Store signing may incur costs; run only after budget/Apple account review.
