<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASEA 공지 관리</title><style>html,body,button,input,textarea,select{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif!important;}body{letter-spacing:-.018em;line-height:1.5}button{font-weight:600}h1,h2,h3{letter-spacing:-.035em;font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#f0f5fc;color:#24334c;font-family:Pretendard,"Malgun Gothic",sans-serif}header{background:white;padding:20px 5vw;border-bottom:1px solid #d9e4f3;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;color:#25499d;font-weight:bold}main{max-width:1100px;margin:25px auto;padding:0 18px}.card{border:1px solid #dee8f5;background:white;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 3px 16px #1b37630a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}button{border:0;border-radius:8px;background:#25499d;color:white;padding:11px 15px;cursor:pointer}button.light{background:#e9f0fa;color:#25499d}input,select,textarea{width:100%;padding:10px;border:1px solid #c8d6e8;border-radius:8px;margin:6px 0 12px;font:inherit}textarea{min-height:90px}label{font-size:13px;font-weight:bold}.muted{font-size:13px;color:#63748d}.hidden{display:none}nav{display:flex;gap:8px}a{color:#25499d}.block{padding:12px;background:#f7f9ff;border:1px dashed #b7c7df;border-radius:8px;margin:8px 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #e9eff8;padding:10px;text-align:left}@media(max-width:700px){.grid,.cols{grid-template-columns:1fr}header{display:block}nav{margin-top:12px}}
</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></head><body><header><div class="brand">ASEA · 통합 공지</div><nav><button class="light" onclick="show('dash')">대시보드</button><button class="light" onclick="show('edit')">공지 디자인</button><button class="light" onclick="show('list')">공지 목록</button><button class="light" onclick="window.open('https://bangdw-hash.github.io/asea-calendar-management/schedule.html','_blank')">일정표</button></nav></header><main><p id="message" class="muted"></p>
<section id="connect" class="card"><h2>Supabase 연결</h2><p class="muted">ASEA 운영 프로젝트의 URL과 공개용 publishable key만 입력하십시오. 비밀키는 입력하지 않습니다.</p><label>프로젝트 URL</label><input id="url" placeholder="https://xxxx.supabase.co"><label>Publishable key</label><input id="key"><button onclick="connect()">연결</button></section>
<section id="signin" class="card hidden"><h2>관리자 로그인</h2><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="password" type="password"><button onclick="login()">로그인</button></section>
<section id="dash" class="hidden"><div class="grid"><div class="card"><span class="muted">공지</span><h1 id="total">—</h1></div><div class="card"><span class="muted">예약</span><h1 id="queued">—</h1></div><div class="card"><span class="muted">최근 갱신</span><h1 id="updated">—</h1></div></div><div class="card"><h2>교직원 업무 공지</h2><p>현재 공지 모듈은 인증과 RLS가 적용된 Supabase를 사용합니다.</p><button onclick="show('edit')">새 공지 작성</button></div></section>
<section id="edit" class="card hidden"><h2>공지 작성 · D3 기본 블록 모드</h2><div class="cols"><div><label>제목</label><input id="title" oninput="preview()" maxlength="160"><label>대상</label><select id="audience"><option value="all">전체</option><option value="person">개인(UUID)</option></select><input id="target" placeholder="개인 대상일 때 사용자 UUID 입력"><label>응답 종류</label><select id="rtype"><option value="ack">확인</option><option value="agree">동의/미동의</option><option value="comment">의견</option></select><div id="blocks"></div><button class="light" onclick="add('paragraph')">+ 본문 블록</button> <button class="light" onclick="add('heading')">+ 제목 블록</button></div><div><h3>미리보기</h3><div id="preview" class="card"></div><button onclick="save()">공지 서버 저장</button><p class="muted">고급 배치·예약 발송·부서 대상 및 설문지는 후속 개발 대상입니다. 기능 완성을 표시하지 않습니다.</p></div></div></section>
<section id="list" class="card hidden"><h2>공지 목록</h2><table><thead><tr><th>제목</th><th>상태</th><th>작성일</th></tr></thead><tbody id="results"></tbody></table></section>
</main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.4';
let sb=null,user=null,blocks=[];const $=x=>document.getElementById(x);function message(x){$('message').textContent=x}
window.show=(id)=>{for(const x of ['connect','signin','dash','edit','list'])$(x).classList.add('hidden');$(id).classList.remove('hidden')};window.connect=()=>{try{let url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co$/.test(url)||key.startsWith('sb_secret_'))throw Error('공개 프로젝트 URL과 공개용 키를 확인하십시오.');sb=createClient(url,key);show('signin')}catch(e){message(e.message)}};window.login=async()=>{let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)return message(r.error.message);let p=await sb.from('notice_profiles').select('role,status').eq('id',r.data.user.id).single();if(p.error||p.data.status!=='active'||!['super','writer'].includes(p.data.role)){await sb.auth.signOut();return message('관리자 권한이 없습니다.')}user=r.data.user;show('dash');load()};async function load(){let r=await sb.from('notice_announcements').select('id,title,status,created_at').order('created_at',{ascending:false});if(r.error)return message(r.error.message);$('total').textContent=r.data.length;$('queued').textContent=r.data.filter(x=>x.status==='scheduled').length;$('updated').textContent='조회 완료';$('results').replaceChildren();r.data.forEach(n=>{let tr=document.createElement('tr');for(let v of [n.title,n.status,new Date(n.created_at).toLocaleString('ko-KR')]){let td=document.createElement('td');td.textContent=v;tr.append(td)}$('results').append(tr)})}
window.add=type=>{blocks.push({type,text:''});draw()};function draw(){$('blocks').replaceChildren();blocks.forEach((b,i)=>{let p=document.createElement('div');p.className='block';let t=document.createElement('textarea');t.placeholder=b.type;t.value=b.text;t.oninput=()=>{b.text=t.value;preview()};let up=document.createElement('button');up.textContent='↑';up.className='light';up.onclick=()=>{if(i>0){[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];draw()}};let del=document.createElement('button');del.textContent='삭제';del.className='light';del.onclick=()=>{blocks.splice(i,1);draw()};p.append(t,up,del);$('blocks').append(p)});preview()}window.preview=()=>{let p=$('preview');p.replaceChildren();let h=document.createElement('h3');h.textContent=$('title').value||'공지 제목';p.append(h);blocks.forEach(b=>{let x=document.createElement(b.type==='heading'?'h4':'p');x.textContent=b.text;p.append(x)})};window.save=async()=>{if(!user)return;let audience=$('audience').value,target=$('target').value.trim();if(audience==='person'&&!/^[a-f0-9-]{36}$/i.test(target))return message('올바른 사용자 UUID가 필요합니다.');let payload={created_by:user.id,title:$('title').value.trim(),blocks,response_type:$('rtype').value,audience,target_id:audience==='all'?null:target||null,status:'published'};let r=await sb.from('notice_announcements').insert(payload);if(r.error)return message('저장 실패: '+r.error.message);message('서버 저장 완료');show('list');load()};add('paragraph');
</script></body></html>
