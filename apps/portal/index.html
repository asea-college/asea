<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ASEA 통합 메시지함</title>
<style>
:root{font-family:Pretendard,"Malgun Gothic",sans-serif;color:#192d4e;background:#edf3fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh;display:grid;grid-template-columns:204px 334px minmax(300px,1fr);background:#fff}.nav{background:#123d89;color:#fff;padding:24px 13px;display:flex;flex-direction:column;gap:14px}.logo{font-size:25px;font-weight:800;letter-spacing:2px;margin:8px 14px 32px}.logo small{display:block;letter-spacing:0;font-size:11px;font-weight:400;margin-top:5px}.nav button{color:#e3edff;background:transparent;border-radius:10px;text-align:left;padding:14px;font-size:15px}.nav button.active{background:#2461c5;color:white}.nav .bottom{margin-top:auto;font-size:12px;padding:10px}.inbox{border-right:1px solid #e0e8f3;padding:23px 17px;min-width:0}.head{display:flex;align-items:center;justify-content:space-between}.head h2{font-size:21px}.primary{background:#225bcc;color:white;padding:11px 17px;border-radius:9px}.sub{background:#eaf1fe;color:#2353a6;padding:10px 15px;border-radius:9px}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.filters button{padding:8px 11px;border-radius:20px;background:#f1f4f9;color:#53657b;font-size:13px}.filters .selected{background:#215fce;color:#fff}.search{width:100%;border:1px solid #dbe5f2;border-radius:9px;padding:12px;margin-bottom:12px}.item{padding:15px 11px;cursor:pointer;border-bottom:1px solid #ebf0f8;border-radius:9px}.item.active{background:#ebf3ff}.item strong{display:block;margin-bottom:6px}.item small{color:#7c8ca2;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;display:block}.chat{min-width:0;display:flex;flex-direction:column;background:#fbfcff;height:100vh}.chatheader{background:#fff;border-bottom:1px solid #e3e9f1;padding:22px}.chatheader strong{font-size:18px}.chatheader small{display:block;color:#8290a3;margin-top:5px}.messages{padding:24px;overflow:auto;flex:1}.date{margin:22px auto;max-width:max-content;color:#788ca9;background:#edf3f9;border-radius:20px;padding:7px 15px;font-size:12px}.bubble{margin:12px 0;max-width:78%;background:#eef2f8;border-radius:14px;padding:13px 15px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{margin-left:auto;background:#daebff}.bubble small{display:block;color:#657c9a;font-size:11px;margin-bottom:5px}.composer{border-top:1px solid #dce5f1;padding:15px;background:white;display:flex;gap:10px}.composer input{flex:1;min-width:0;border:1px solid #dce5f1;border-radius:10px;padding:12px}.status{color:#a34c28;padding:12px;font-size:12px}.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0a3a84,#e8f1ff)}.login{background:white;padding:34px;width:min(440px,92vw);border-radius:20px;box-shadow:0 15px 55px #0b347e40}.login h1{color:#1450a0}.login input{display:block;width:100%;padding:13px;margin:12px 0;border:1px solid #c8d8ed;border-radius:8px}.login button{width:100%}.login p{font-size:13px;color:#667895}.notice{font-size:12px;color:#6a7a92}.mobilebar{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}.nav{display:none}.inbox{border-right:0;padding-bottom:70px}.chat{position:fixed;inset:0;z-index:3;display:none}.chat.visible{display:flex}.chatheader{display:flex;gap:10px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;justify-content:space-around;padding:17px;z-index:2;border-top:1px solid #edf0f5}.bubble{max-width:90%}}
</style></head><body><section id="auth" class="login-wrap"><form id="login" class="login"><h1>ASEA</h1><h2>교직원 통합 포털</h2><p>승인된 교직원 계정으로 로그인하십시오.</p><input id="email" type="email" placeholder="이메일" required autocomplete="username"><input id="password" type="password" placeholder="비밀번호" required autocomplete="current-password"><button class="primary">로그인</button><p>별도 아이디 로그인은 공통 인증 API 구축 후 제공됩니다.</p><p id="autherror" class="status"></p></form></section>
<div id="application" class="app hidden">
<aside class="nav"><div class="logo">ASEA<small>통합 교직원 포털</small></div><button class="active">▣ 메시지함</button><button id="calendar">▦ 학교 일정</button><button id="logout">⇥ 로그아웃</button><div class="bottom">ASEA · Internal Staff</div></aside>
<section class="inbox"><div class="head"><h2>메시지함</h2><span>✉</span></div><div class="filters"><button class="selected" data-kind="all">전체</button><button data-kind="department">부서</button><button data-kind="direct">개인</button></div><input class="search" id="search" placeholder="대화방 검색"><div id="rooms"></div><p class="notice">메시지는 서울 시간 기준으로 표시합니다.</p><p id="roomstatus" class="status"></p></section>
<article id="chat" class="chat"><header class="chatheader"><button id="back" class="sub" style="display:none">←</button><div><strong id="roomtitle">대화방을 선택하십시오</strong><small id="roomdetail">3번 UI · 시간순 누적 기록</small></div></header><div id="messages" class="messages"><div class="date">대화방을 선택하여 기록을 확인하십시오.</div></div><form id="sendform" class="composer"><input id="message" autocomplete="off" maxlength="10000" placeholder="메시지를 입력하세요" required><button class="primary">보내기</button></form></article>
<div class="mobilebar"><span>홈</span><strong>메시지</strong><span>공지</span><span>일정</span></div></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.57.4";
const url="https://zbpeyklwpotjyveipzxd.supabase.co";
const key="sb_publishable_DxtNEPtU2KktlcRQnQx9jA_szCPFzMj";
const sb=createClient(url,key),$=id=>document.getElementById(id);
let actor=null,allRooms=[],selected=null,filter="all",lastDate="";
const fmt=t=>new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit"});
const day=t=>new Date(t).toLocaleDateString("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"long"});
function status(s){$("roomstatus").textContent=s||""}
$("login").onsubmit=async e=>{e.preventDefault();$("autherror").textContent="인증 중입니다.";const {data,error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)return $("autherror").textContent=error.message;const p=await sb.from("notice_profiles").select("status").eq("id",data.user.id).maybeSingle();if(p.error||p.data?.status!=="active"){await sb.auth.signOut();return $("autherror").textContent="관리자 승인이 필요하거나 공지 서비스 계정이 없습니다."}actor=data.user;$("auth").classList.add("hidden");$("application").classList.remove("hidden");await loadRooms()};
$("logout").onclick=async()=>{await sb.auth.signOut();actor=null;selected=null;$("application").classList.add("hidden");$("auth").classList.remove("hidden")};
$("calendar").onclick=()=>window.open("https://bangdw-hash.github.io/asea-calendar-management/schedule.html","_blank","noopener");
async function loadRooms(){const {data,error}=await sb.from("notice_rooms").select("id,title,kind").order("created_at",{ascending:true});if(error)return status(error.message);allRooms=data||[];renderRooms();status(allRooms.length?"":"참여 가능한 대화방이 없습니다. 관리자의 대화방 설정을 확인하십시오.")}function renderRooms(){const target=$("rooms");target.replaceChildren();for(const r of allRooms.filter(r=>(filter==="all"||r.kind===filter)&&r.title.includes($("search").value.trim()))){const el=document.createElement("div");el.className="item"+(selected?.id===r.id?" active":"");const title=document.createElement("strong");title.textContent=(r.kind==="all"?"📢 ":r.kind==="department"?"👥 ":"👤 ")+r.title;const hint=document.createElement("small");hint.textContent=r.kind==="all"?"전체 메시지":r.kind==="department"?"부서 메시지":"개인 메시지";el.append(title,hint);el.onclick=()=>openRoom(r);target.append(el)}}
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{filter=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("selected",x===b));renderRooms()});$("search").oninput=renderRooms;
async function openRoom(r){selected=r;renderRooms();$("roomtitle").textContent=r.title;$("roomdetail").textContent=r.kind==="all"?"전체 교직원":r.kind==="department"?"부서 대화방":"개인 대화";$("chat").classList.add("visible");$("back").style.display=matchMedia("(max-width:800px)").matches?"block":"none";await loadMessages()}$("back").onclick=()=>$("chat").classList.remove("visible");
async function loadMessages(){if(!selected)return;let id=selected.id;const{data,error}=await sb.from("notice_messages").select("id,body,sender_id,created_at,category").eq("room_id",id).order("created_at",{ascending:false}).limit(100);if(id!==selected?.id)return;if(error)return status(error.message);const area=$("messages");area.replaceChildren();lastDate="";for(const m of (data||[]).reverse()){const d=day(m.created_at);if(d!==lastDate){const mark=document.createElement("div");mark.className="date";mark.textContent=d;area.append(mark);lastDate=d}const el=document.createElement("div");el.className="bubble"+(m.sender_id===actor.id?" mine":"");const info=document.createElement("small");info.textContent=(m.sender_id===actor.id?"나 · ":"메시지 · ")+fmt(m.created_at);const content=document.createElement("span");content.textContent=m.body;el.append(info,content);area.append(el)}area.scrollTop=area.scrollHeight}
$("sendform").onsubmit=async e=>{e.preventDefault();if(!selected||!actor)return;const msg=$("message").value.trim();if(!msg)return;const {error}=await sb.from("notice_messages").insert({room_id:selected.id,sender_id:actor.id,body:msg,category:"general_message",client_nonce:crypto.randomUUID()});if(error)return status("전송 실패: "+error.message);$("message").value="";status("");await loadMessages()};
setInterval(()=>{if(actor&&selected)loadMessages()},15000);
</script></body></html>
